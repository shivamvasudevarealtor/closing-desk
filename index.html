<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Closing Desk</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com/gsi/ https://www.googleapis.com https://gmail.googleapis.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Closing Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<script src="theme.js"></script>
<script src="launch.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app" id="app">
  <div class="strip">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></span>
    <div class="seg2" role="group" aria-label="Switch app">
      <a class="s" href="tasks.html" aria-label="Win the Day">Win</a>
      <span class="s on" aria-current="page">Clients</span>
      <a class="s" href="dashboard.html" aria-label="Dashboard">Dash</a>
    </div>
    <span class="sp"></span>
    <button class="ib" id="themeBtn" type="button" aria-label="Switch to light mode"><svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <button class="ib bell" id="bellBtn" type="button" data-act="bell" aria-label="What's new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.6-2.4V10a4.4 4.4 0 0 0-8.8 0v4.6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="bdot" id="bellDot" hidden></span></button>
  </div>
  <div class="top">
    <div>
      <h1 id="title">Today</h1>
      <div class="sub num" id="subtitle"></div>
    </div>
    <div class="acts">
      <button class="btn primary" id="addBtn" type="button">+ New lead</button>
    </div>
  </div>
  <div id="warnBar"></div>
  <div id="tellHost" hidden></div>
  <div id="view"></div>
</div>

<div id="bulkHost"></div>
<nav class="tabs" aria-label="Main">
  <div class="in">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today<span class="badge" id="dueBadge" hidden></span></button>
    <button type="button" data-tab="pipeline"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="6" rx="1.5"/></svg>Pipeline</button>
    <button type="button" data-tab="lists"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Lists</button>
    <button type="button" data-tab="email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5 12 13l8.5-5.5"/></svg>Email</button>
    <button type="button" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
  </div>
</nav>
<div id="sheetHost"></div>
<div id="toastHost" aria-live="polite"></div>
<div id="authHost"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="supa.js"></script>
<script src="osstats.js"></script>
<script src="gmail.js"></script>
<script src="app.js"></script>
<script src="email.js"></script>
<script src="tell.js"></script>
</body>
</html>
