<body class="pg-clients">

<div class="app" id="app">
  <div class="strip">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M9 15l2.2 2.2L15 12.8"/></svg></span>
    <span class="brand">Realtor OS</span>
    <span class="sp"></span>
    <button class="ib" id="themeBtn" type="button" aria-label="Switch to light mode"><svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <button class="ib more-gear" type="button" data-tab="more" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    <button class="ib bell" id="bellBtn" type="button" data-act="bell" aria-label="What's new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.6-2.4V10a4.4 4.4 0 0 0-8.8 0v4.6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="bdot" id="bellDot" hidden></span></button>
  </div>
  <div class="top">
    <div>
      <h1 id="title">Today</h1>
      <div class="sub num" id="subtitle"></div>
    </div>
    <div class="acts">
      <button class="btn primary" id="addBtn" type="button">+ New lead</button>
    </div>
  </div>
  <div id="warnBar"></div>
  <div id="tellHost" hidden></div>
  <div id="view"></div>
</div>

<div id="bulkHost"></div>
<nav class="tabs" aria-label="Main">
  <div class="in">
    <div class="sb" aria-hidden="true"><span class="lg"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M9 15l2.2 2.2L15 12.8"/></svg></span><span class="sbn">Realtor OS</span></div>
    <a href="home.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10v9.5h11V10"/><path d="M10 19.5v-5h4v5"/></svg>Home</a>
    <a href="tasks.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.3 12.2l2.6 2.6 4.8-5.2"/></svg>Tasks</a>
    <button type="button" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.9-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.6-.3 4.4 1.2 5 4.3"/></svg>Clients<span class="badge" id="dueBadge" hidden></span></button>
    <button type="button" data-tab="pipeline"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="5" height="16" rx="1.6"/><rect x="10" y="4" width="5" height="10" rx="1.6"/><rect x="16.5" y="4" width="4" height="13" rx="1.6"/></svg>Pipeline</button>
    <button type="button" data-tab="email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5 12 13l8.5-5.5"/></svg>Email</button>
    <button type="button" data-tab="more" class="more-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</button>
  </div>
</nav>

<div id="toastHost" aria-live="polite"></div>
